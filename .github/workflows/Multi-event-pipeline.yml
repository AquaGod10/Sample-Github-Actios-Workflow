name: "Multi-event-pipeline" # Name of pipeline
on:
    push: #Event1: Whenever a push is made to the repository on the master branch
        branches:
            - master
            - test
    schedule: #event2
        - cron: 30 5 * * 2,4

    pull_request: #event3
        branches:
            - master
            - test
        types:
            - closed
            - opened     


jobs:
    on-push: #job 1
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps: #Steps to be executed in the job
            - name: "Running on master push" # step1
              run: echo "Running on master push"
    on-pull: #job2
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps: 
            - name: "Running on pull request"
              run: echo "Running on pull request"
    on-pull-request-closed: #job 3
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps: 
            - name: "Running on pull request on close"
              run: echo "Running on pull request on close"
    on-schedule: #job4
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        steps: 
            - name: "Running on schedule"
              run: echo "Running on schedule"
